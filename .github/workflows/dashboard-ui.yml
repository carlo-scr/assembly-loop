name: Dashboard checks

on:
  pull_request:
    paths:
      - "assemblyloop/web/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/dashboard-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    name: Tests and dashboard screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASSEMBLY_UI_TESTS: "1"
      ASSEMBLY_UI_ARTIFACTS: /tmp/assembly-loop-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Install Chromium and its system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: python -m ruff check .
      - name: Run all tests on the stand-in arm
        run: python -m pytest -q
      - name: Upload dashboard review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-review-images
          path: ${{ env.ASSEMBLY_UI_ARTIFACTS }}
          if-no-files-found: ignore
          retention-days: 14
